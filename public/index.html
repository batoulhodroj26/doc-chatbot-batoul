<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">

   <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h1 class="h4 mb-0">Document Chatbot</h1>
      <div class="d-flex gap-2">
        <button id="clearChatBtn" class="btn btn-outline-danger btn-sm">Clear chat</button>
        <button id="themeBtn" class="btn btn-outline-secondary btn-sm">Dark mode</button>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <form id="uploadForm" class="d-flex gap-2 flex-wrap">
          <input type="file" id="fileInput" class="form-control" accept=".pdf,.txt,.docx,.csv">
          <button type="submit" class="btn btn-primary">Upload</button>
        </form>
        <div id="uploadStatus" class="small mt-2 text-muted"></div>
        <div class="d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
         <ul id="docList" class="small mb-0 ps-3"></ul>
         <button id="clearDocsBtn" class="btn btn-outline-warning btn-sm">Clear documents</button>
   </div>
      </div>
    </div>

    <div class="card">
      <div id="chatBox" class="card-body chat-box"></div>
      <div class="card-footer">
        <form id="chatForm" class="d-flex gap-2">
          <input type="text" id="questionInput" class="form-control" placeholder="Ask a question about your document...">
          <button type="submit" class="btn btn-success">Send</button>
        </form>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
